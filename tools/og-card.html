<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{width:1020px;height:536px;overflow:hidden}
 .scale{transform:scale(.85);transform-origin:0 0;width:1200px;height:630px}
 .card{width:1200px;height:630px;background:#1c1c16;position:relative;
   font-family:'Open Sans',Helvetica,sans-serif;display:flex;align-items:center;
   background-image:linear-gradient(rgba(200,120,40,.05) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(200,120,40,.05) 1px,transparent 1px);
   background-size:40px 40px,40px 40px;}
 .bird{position:absolute;right:62px;top:50%;transform:translateY(-50%);height:512px;
   filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
 .txt{padding-left:84px;position:relative;z-index:2;max-width:700px}
 .mark{font-size:92px;font-weight:800;color:#c87828;letter-spacing:7px;line-height:1;
   text-shadow:0 2px 14px rgba(0,0,0,.6)}
 .sub{font-size:25px;color:rgba(255,255,255,.72);letter-spacing:1.2px;margin-top:20px}
 .rule{width:132px;height:3px;background:#c87828;margin:32px 0 26px;opacity:.85}
 .kick{font-size:17px;color:rgba(255,255,255,.44);letter-spacing:2.6px;text-transform:uppercase;line-height:1.85}
</style></head><body>
<div class="scale"><div class="card">
  <img class="bird" src="../assets/img/kestrel-transparent.png" alt="">
  <div class="txt">
    <div class="mark">KESTREL</div>
    <div class="sub">Signal focus, precision response</div>
    <div class="rule"></div>
    <div class="kick">Linux detection engineering<br>ATT&amp;CK&reg; &middot; eBPF telemetry &middot; signals</div>
  </div>
</div></div></body></html>
